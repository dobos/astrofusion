[package]
name = "astrofusion_datafusion"
version = "0.1.0"
edition = "2021"

[lib]
name = "datafusion"
crate-type = ["cdylib"]

[dependencies]
arrow = "53.3.0"
async-trait = "0.1.0"
datafusion = "45.0.0"
datafusion-expr = "45.0.0"
pyo3 = { version = "0.22.4", features = ["extension-module", "abi3-py38"] }
tokio = { version = "1.45.1", features = ["rt-multi-thread"] }
